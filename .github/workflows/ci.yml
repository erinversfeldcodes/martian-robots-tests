name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Reads rust-toolchain.toml, so CI and a developer's machine install the
      # same compiler from the same file.
      - name: Install the pinned toolchain
        run: rustup toolchain install

      - name: Formatted
        run: cargo fmt --all --check

      - name: Linted, warnings denied
        run: cargo clippy --all-targets -- -D warnings

      - name: Tested, including the suite graded against broken implementations
        run: cargo test --quiet

      - name: The contract is coherent
        run: cargo run --quiet -- --contract > /dev/null
