# The contract is data, and the suite is software. Both are gated here.
#
# The contract's gate is not a diff against a generated copy - there is no
# generated copy in the tree. It is that the data still makes sense: it parses,
# every ruled question carries a ruling, every open one carries a note, no id
# appears twice, and the narrative has no hole nothing fills. Rendering it is
# how that gets checked.
#
# `defaults: run: shell: bash` is not cosmetic. Without it GitHub runs each
# `run:` step as `bash -e {0}` - no pipefail - so a gate written as
# `./something | tee log` reports tee's exit status and cannot turn a job red.
#
# Actions are pinned by commit SHA with the tag in a comment. A tag is a
# movable label; a SHA is not.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Reads rust-toolchain.toml, so CI and a developer's machine install the
      # same compiler from the same file.
      - name: Install the pinned toolchain
        run: rustup toolchain install

      - name: Formatted
        run: cargo fmt --all --check

      - name: Linted, warnings denied
        run: cargo clippy --all-targets -- -D warnings

      - name: The contract is coherent
        run: cargo run --quiet -- --contract > /dev/null
