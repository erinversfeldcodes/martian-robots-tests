[package]
name = "martian-robots-verify"
version = "2.1.0"
description = "The Martian Robots CLI contract, and the suite that enforces it"
edition = "2024"
rust-version = "1.93"
license = "MIT"
repository = "https://github.com/erinversfeldcodes/martian-robots-tests"

# The suite is what `cargo run` means here. Without this, the probe and the
# near-miss gallery make `cargo run -- --contract` ambiguous, which breaks the
# command the README gives and the last step of CI.
default-run = "martian-robots-verify"

[lib]
name = "martian_robots_verify"
path = "src/lib.rs"

[[bin]]
name = "martian-robots-verify"
path = "src/main.rs"

# The contract is TOML, so the suite parses TOML. Everything else it needs -
# running a process, comparing bytes - the standard library already provides,
# and a dependency here would have to earn its place by making the grading
# better rather than the code shorter.
[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.9"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

# This library has one documented entry point for callers outside this
# repository: `Contract::load`, so an implementation can derive its constants
# from the contract in a build script rather than restating them. Everything
# else exists so the suite, the conforming probe and the near-miss gallery can
# share the contract loader, the mission model and the reference simulation.
# The three lints below describe obligations to callers of that internal
# surface; satisfying them would add thirty-three attributes and doc sections
# that state nothing true.
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
