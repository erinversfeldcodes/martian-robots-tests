syntax = "proto3";

// The contract, as a schema.
//
// This file says what a contract *is*. `contract.toml` says what this
// contract's values *are*, and is authored by hand because the rulings are
// prose that people read and argue over in diffs. The Rust types the suite
// uses are generated from this file, so the shape is stated once and the
// suite cannot disagree with it.
//
// Everything a consumer needs is here: another implementation, in any language
// protoc targets, generates its own types from this same file.
package martian_robots.contract;

message Contract {
  // Semver. Major and minor are what conformance depends on; the patch counts
  // releases of the suite that enforces this contract.
  string version = 1;

  Limits limits = 2;
  Grammar grammar = 3;

  // Every question the problem statement leaves open, ruled or deliberately
  // open. Ordered: the document renders them in this sequence.
  repeated Ruling rulings = 4;

  // What the letters mean, as distinct from which letters the grammar admits.
  Semantics semantics = 5;
}

// The meaning of a mission, which no grammar can express.
//
// The problem statement says these in prose: where the world's lower-left
// corner is, that north is the direction from (x, y) to (x, y + 1), that L and
// R turn ninety degrees, that F advances one grid point. Stating them here
// rather than in each implementation is what lets the letters and their
// meanings be generated together, so a command type added to this contract
// cannot be silently ignored by a reader that still knows only three.
message Semantics {
  // The world's lower-left corner. The problem statement assumes it rather
  // than stating it, and an implementation that assumed otherwise would be
  // wrong in a way nothing here would catch.
  Position origin = 1;

  // Every orientation, with the step it takes. The letters live here and not
  // in the grammar: the grammar's `orientation` production is rendered from
  // these, so there is one place a letter is written down.
  repeated Orientation orientations = 2;

  // Every command, with what it does. Likewise the grammar's `instruction`
  // production. Adding one here is what "provision should be made for
  // additional command types" means in practice.
  repeated Command commands = 3;

  // How a robot's final position is written.
  Output output = 4;
}

message Position {
  uint32 x = 1;
  uint32 y = 2;
}

message Orientation {
  // The letter the grammar admits for it.
  string letter = 1;

  // The step `advance` takes while facing this way, as a signed offset. North
  // is (0, 1) because the problem statement fixes that one; the others follow
  // from turning, and a reader can derive the compass order from the angles
  // rather than being told it separately.
  int32 dx = 2;
  int32 dy = 3;
}

message Command {
  // The letter the grammar admits for it.
  string letter = 1;

  oneof effect {
    // Clockwise is positive, so `R` is 90 and `L` is -90.
    int32 turn_degrees = 2;

    // Grid points moved in the direction currently faced.
    uint32 advance = 3;
  }
}

message Output {
  // A robot's line, with `{x}`, `{y}` and `{orientation}` filled in.
  string line = 1;

  // Appended to that line when the robot left the world.
  string lost_suffix = 2;

  // The line ending emitted, whatever the input used.
  string line_ending = 3;
}

// The numeric facts. Not expressible in the grammar, which is why they are
// here and why the suite's boundary cases read them from this file.
message Limits {
  uint32 max_coordinate = 1;
  uint32 max_instructions = 2;
}

// The input grammar, as productions rather than as text. The EBNF a reader
// sees is rendered from this, so the terminals the suite injects and the
// grammar the contract publishes are the same facts.
message Grammar {
  // Prose that the productions cannot carry: the framing rules, and what
  // lives in Limits instead.
  string note = 1;
  repeated Production productions = 2;
}

message Production {
  string name = 1;

  // A terminal production: an alternation of literals, as in
  // `orientation = "N" | "S" | "E" | "W" ;`. Exactly one of this and `terms`
  // is set.
  repeated string literals = 2;

  // A composite production: a concatenation of other productions, as in
  // `number = digit , { digit } ;`.
  repeated Term terms = 3;

  // The trailing `(* ... *)` a reader sees, if any.
  string comment = 4;
}

message Term {
  // The production this term refers to.
  string name = 1;

  // `{ name }` — zero or more.
  bool is_repeated = 2;

  // `[ name ]` — zero or one.
  bool is_optional = 3;
}

message Ruling {
  // `R`-numbered when ruled, `Q`-numbered when open.
  string id = 1;

  string question = 2;

  // Ruled or open, never both and never neither. The schema makes "both"
  // impossible; "neither" stays a check, because a proto3 oneof is optional.
  oneof decision {
    Ruled ruled = 3;
    Open open = 4;
  }
}

// An answer that is contract: an implementation that disagrees is wrong, and a
// case is expected to pin it.
message Ruled {
  string ruling = 1;
  string rationale = 2;
}

// Deliberately undecided: no case may test it, and an implementation may
// answer it however it likes.
message Open {
  string note = 1;
}
